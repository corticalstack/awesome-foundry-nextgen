[project]
name = "awesome-foundry-nextgen"
version = "0.10.0"
description = "Hands-on labs for Microsoft Foundry — Azure's unified PaaS for enterprise AI"
requires-python = ">=3.11"
dependencies = [
    # Core Foundry SDKs
    # agent-framework-foundry caps azure-ai-projects below 2.8.
    "azure-ai-projects>=2.7.0",
    "azure-ai-evaluation[redteam]>=1.18.7",
    # Imported directly by 08-06-01. McpTool only exists on the 1.2 beta line.
    "azure-ai-agents>=1.2.0b6",
    # Preview line: the Foundry IQ labs use knowledge base answer synthesis,
    # which agent-framework-azure-ai-search only allows on a preview build.
    "azure-search-documents>=12.1.0b2",
    "openai>=3.0.0",
    # Agent Framework. agent-framework-azure-ai stopped at 1.0.0rc6; the
    # AzureAISearchContextProvider it provided now ships in -azure-ai-search.
    "agent-framework-core>=1.20.0",
    "agent-framework-azure-ai-search>=1.0.0b261002",
    "agent-framework-openai>=1.15.0",
    "agent-framework-foundry>=1.14.0",
    # Observability
    "azure-monitor-opentelemetry>=1.6.0",
    "azure-monitor-query>=1.4.0",
    # Data / utilities
    "datasets>=3.0.0",
    "pandas>=2.0.0",
    "jinja2>=3.0.0",
    "requests>=2.32.0",
    # Auth / config
    "azure-identity>=1.26.0",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    # scripts/run_notebooks.py
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.0.2",
]

# Fine-tuning section (15-*) - pulls in PyTorch + Hugging Face + matplotlib.
# Large install (~3GB with CUDA). Sync with: `uv sync --group finetune`.
#
# transformers is pinned to the 4.x line because Phi-4-mini's custom remote
# code (modeling_phi3.py served from the Hugging Face hub) imports symbols
# (e.g. `LossKwargs`) that were removed in transformers 5.x. The ACA
# fine-tune job in azure_infra.py pins the same 4.53.3 version explicitly,
# and pins peft to the version in uv.lock; the local install needs to match
# for 15-04 (local inference) to load the adapter without ImportErrors.
finetune = [
    "torch>=2.0.0",
    "transformers==4.53.3",
    "peft>=0.10.0",
    "matplotlib>=3.7.0",
    "azure-storage-blob>=12.20.0",
]

[tool.uv]
# Pre-releases only where a requirement above asks for one, or where a package
# has no stable release. "allow" let alphas of unrelated packages into the lock.
prerelease = "if-necessary-or-explicit"
