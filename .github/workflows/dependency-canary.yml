name: Dependency canary

# Weekly: resolve every dependency to its newest allowed release on a throwaway
# checkout and run the offline checks against that. The committed lock and the
# compiled container pins never change by themselves, so this is what notices an
# upstream release breaking the labs, before anyone tries to upgrade. Nothing is
# committed. A failure opens (or adds to) a tracking issue; a green run closes it.

on:
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC, before the live notebook run
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/dependency-canary.yml
      - scripts/check_imports.py
      - scripts/check_sdk_kwargs.py
      - scripts/ci_report.py

permissions:
  contents: read

concurrency:
  group: dependency-canary
  cancel-in-progress: false

jobs:
  root-env:
    name: Notebooks and helpers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes full version tags only (no moving v10 tag).
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.7"
          python-version: "3.13"

      - name: Resolve the newest allowed releases
        run: |
          cp uv.lock "$RUNNER_TEMP/uv.lock.committed"
          uv lock --upgrade
          python3 scripts/ci_report.py lock-diff "$RUNNER_TEMP/uv.lock.committed" uv.lock > "$RUNNER_TEMP/lock-diff.md"
          cat "$RUNNER_TEMP/lock-diff.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: lock-diff
          path: ${{ runner.temp }}/lock-diff.md

      - name: Install the newest releases
        run: uv sync --frozen

      - name: Imports resolve
        run: uv run --frozen python scripts/check_imports.py

      - name: SDK model keyword arguments match
        run: uv run --frozen python scripts/check_sdk_kwargs.py

      # One pytest run per suite. The three suites also pass together in a single run.
      - name: Unit tests
        run: |
          for suite in 08-agents/08-05-contoso-pmo-mcp/tests \
                       08-agents/08-05b-contoso-private-banking-mcp/tests \
                       11-foundry-iq-multi-agent/tests; do
            uv run --frozen pytest -q "$suite"
          done

  containers:
    name: Image ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 08-03
            context: 08-agents/08-03-hosted-agents/contoso-wealth-agent
            app: /app
          - name: 08-10
            context: 08-agents/08-10-hosted-copilot-sdk-agent/src/github-copilot-invocations
            app: /app/user_agent
          - name: 08-10b
            context: 08-agents/08-10b-hosted-copilot-sdk-agent-multi/src/github-copilot-invocations
            app: /app/user_agent
          - name: 08-10c
            context: 08-agents/08-10c-hosted-copilot-sdk-agent-runtime-model/src/github-copilot-invocations
            app: /app/user_agent
          - name: 08-11
            context: 08-agents/08-11-hosted-claude-agent-sdk-agent/src/claude-agent-sdk-invocations
            app: /app/user_agent
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.7"

      # requirements.txt records the command that compiled it (Python version and
      # glibc target of the base image) on its second line; rerun it with --upgrade.
      - name: Recompile the pins at the newest releases
        working-directory: ${{ matrix.context }}
        run: |
          cmd=$(sed -n '2s/^#[[:space:]]*//p' requirements.txt)
          echo "$cmd --upgrade"
          $cmd --upgrade
          git diff --stat -- requirements.txt

      - name: Build
        run: docker build --platform linux/amd64 -t lab-image "${{ matrix.context }}"

      - name: Imports resolve inside the image
        run: >-
          docker run --rm --platform linux/amd64
          -v "$PWD/scripts:/ci:ro" --entrypoint python
          lab-image /ci/check_imports.py "${{ matrix.app }}"

  function-apps:
    name: Function app ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: contoso-pmo-mcp
            dir: 08-agents/08-05-contoso-pmo-mcp/contoso-pmo-mcp
          - name: private-banking-mcp
            dir: 08-agents/08-05b-contoso-private-banking-mcp/private-banking-mcp
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.7"

      - name: Recompile the pins at the newest releases
        working-directory: ${{ matrix.dir }}
        run: |
          cmd=$(sed -n '2s/^#[[:space:]]*//p' requirements.txt)
          echo "$cmd --upgrade"
          $cmd --upgrade

      # The Functions runtime version both setup notebooks deploy with.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r "${{ matrix.dir }}/requirements.txt"

      - name: Imports resolve
        run: python scripts/check_imports.py "${{ matrix.dir }}"

  report:
    name: Tracking issue
    needs: [root-env, containers, function-apps]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: lock-diff

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ROOT: ${{ needs.root-env.result }}
          CONTAINERS: ${{ needs.containers.result }}
          FUNCTIONS: ${{ needs.function-apps.result }}
        run: |
          title="Dependency canary: the newest releases break the offline checks"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
                     --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ "$ROOT" = success ] && [ "$CONTAINERS" = success ] && [ "$FUNCTIONS" = success ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "Passing again: $RUN_URL"
            fi
            exit 0
          fi
          {
            echo "The weekly dependency canary failed: $RUN_URL"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Notebooks and helpers | $ROOT |"
            echo "| Container images | $CONTAINERS |"
            echo "| Function apps | $FUNCTIONS |"
            echo
            cat lock-diff.md 2>/dev/null || echo "(version diff not available)"
            echo
            echo "Refs #31"
          } > body.md
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$title" --body-file body.md
          fi
